<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>axis visualizer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { 
        width: 100%; height: 100%; overflow: hidden;
        background: #111; color: #aaa;
        font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        font-size: 12px;
      }

      #app {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
      }

      /* playback bar */
      #playback-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: #1a1a1a;
        border-bottom: 1px solid #282828;
        flex-shrink: 0;
        z-index: 10;
      }

      button {
        background: #222;
        color: #aaa;
        border: 1px solid #333;
        padding: 4px 10px;
        font-family: inherit;
        font-size: 11px;
        cursor: pointer;
        border-radius: 2px;
      }
      button:hover { background: #2a2a2a; color: #ddd; }
      button:active { background: #333; }

      .btn-play { min-width: 70px; }
      .btn-play.playing { color: #ff6644; }

      .btn-add { color: #4488ff; border-color: #336; }
      .btn-add:hover { background: #1a2a3a; }

      .scrubber {
        flex: 1;
        accent-color: #555;
        height: 4px;
        cursor: pointer;
      }

      select {
        background: #1a1a1a;
        color: #aaa;
        border: 1px solid #333;
        padding: 3px 6px;
        font-family: inherit;
        font-size: 11px;
        border-radius: 2px;
        cursor: pointer;
      }
      select:focus { outline: 1px solid #555; }

      label {
        color: #666;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      input[type="checkbox"] {
        accent-color: #555;
        cursor: pointer;
      }

      /* main content area */
      #main-content {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      /* panel controls overlay on top of the canvas */
      #panels-ui {
        position: absolute;
        top: 0; left: 0; right: 0;
        display: flex;
        z-index: 5;
        pointer-events: none;
      }

      .panel-controls {
        flex: 1;
        padding: 8px;
        pointer-events: auto;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }

      .panel-label {
        color: #555;
        font-size: 10px;
        font-weight: bold;
        text-transform: uppercase;
      }

      .btn-remove {
        background: none;
        border: none;
        color: #555;
        font-size: 16px;
        padding: 0 4px;
        line-height: 1;
      }
      .btn-remove:hover { color: #ff4444; }

      .control-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 3px;
      }
      .control-row label { min-width: 48px; }

      .trick-desc {
        color: #444;
        font-size: 10px;
        margin-top: 2px;
        font-style: italic;
      }

      .side-row { gap: 4px; }
      .side-radio { accent-color: #555; cursor: pointer; }
      .side-label {
        color: #888;
        font-size: 11px;
        margin-right: 4px;
        cursor: pointer;
      }

      /* divider lines between panels */
      .panel-controls + .panel-controls {
        border-left: 1px solid #282828;
      }

      /* canvas takes full remaining space */
      #render-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="playback-bar"></div>
      <div id="main-content">
        <div id="panels-ui"></div>
        <canvas id="render-canvas"></canvas>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
